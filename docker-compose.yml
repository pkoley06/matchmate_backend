services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: matchmate-db
    restart: unless-stopped
    # Values come from the .env file next to this file (docker compose reads it automatically).
    # NOTE: Postgres only uses these when the pgdata volume is created for the FIRST time.
    # Changing DB_PASSWORD later does not change the password of an existing database.
    environment:
      POSTGRES_DB: ${DB_NAME:-matchmate_db}
      POSTGRES_USER: ${DB_USER:-dev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
