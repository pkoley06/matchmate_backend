server:
  port: 8080

spring:
  application:
    name: matchmate-backend

  web:
    error:
      # Dev setting: put our error text (e.g. "User must be at least 18 years old") into the JSON
      # error body so the Flutter app can show it. Without this, "message" is always missing.
      # (Spring Boot 4 renamed this: the old "server.error.*" keys are silently ignored now.)
      include-message: always
      include-binding-errors: always

  # Load secrets/settings from the git-ignored .env file in the project root (KEY=VALUE format).
  # "optional:" = don't crash if the file is missing (e.g. in production, where real
  # environment variables are used instead; those always win over .env).
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/matchmate_db}
    username: ${DB_USER:dev_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Raw, pre-compression caps — generous enough for a handful of full-size phone photos.
      # The actual stored-size budgets (200KB profile / 2MB listing batch) are enforced by
      # ImageProcessingService after upload, not by these limits.
      max-file-size: 15MB
      max-request-size: 60MB


# ==========================================
# Security & JWT Configuration
# ==========================================
jwt:
  # Comes from
  #  JWT_SECRET in .env (or a real environment variable). No default on purpose:
  # if it is missing, the app refuses to start instead of silently using a weak/public key.
  secret: ${JWT_SECRET}
  # 86400000 ms = 24 hours
  expiration-ms: 86400000
  issuer: matchmate-backend

# ==========================================
# Firebase Admin SDK Configuration
# ==========================================
firebase:
  # The service-account JSON lives in the git-ignored secrets/ folder (NOT in src/main/resources,
  # which would pack it into the jar). "file:./..." is relative to the folder the app starts in.
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:file:./secrets/firebase-service-account.json}

# ==========================================
# Object storage (profile/listing photo uploads)
# ==========================================
app:
  storage:
    # "local" (default) writes to disk and serves files back from this app — zero cloud setup
    # needed, but NOT safe behind the prod container (read-only filesystem, no persistent
    # volume). Set to "s3" once a real bucket (AWS S3, OCI Object Storage, MinIO, ...) exists;
    # see deploy/DEPLOY-RUNBOOK.md Step F.
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${STORAGE_BUCKET:}
    region: ${STORAGE_REGION:us-east-1}
    # S3-compatible endpoint override (needed for OCI/MinIO; leave blank for real AWS S3).
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    # OCI/MinIO need path-style bucket addressing; real AWS S3 works with either.
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
    # Prefix the returned photo URLs are built from. For "s3" this is the bucket's public
    # read URL; for "local" it defaults to this server's own base URL.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    max-profile-photo-bytes: ${STORAGE_MAX_PROFILE_PHOTO_BYTES:204800}
    max-listing-photos-total-bytes: ${STORAGE_MAX_LISTING_PHOTOS_TOTAL_BYTES:2097152}
