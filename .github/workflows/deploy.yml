name: Deploy

on:
  workflow_call:
    inputs:
      sha:
        description: 'Full 40-character commit SHA to deploy'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA to deploy or rollback to'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate commit SHA format
        run: |
          TARGET_SHA="${{ inputs.sha }}"
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Target SHA '${TARGET_SHA}' is not a valid 40-character hexadecimal commit hash."
            exit 1
          fi
          echo "Validated commit SHA: ${TARGET_SHA}"

      - name: Configure SSH credentials
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Execute deployment on VM via SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          echo "${GH_TOKEN}" | ssh -o IdentitiesOnly=yes -o BatchMode=yes -i ~/.ssh/id_ed25519 "deploy@${OCI_HOST}" "sudo /usr/local/bin/matchmate-backend-deploy ${TARGET_SHA}"
