name: CI & Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare mock secrets for CI tests
        run: |
          mkdir -p secrets
          cat << 'EOF' > secrets/firebase-service-account.json
          {
            "type": "service_account",
            "project_id": "matchmate-ci-test",
            "private_key_id": "ci_key_id",
            "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC3ci_dummy_key\n-----END PRIVATE KEY-----\n",
            "client_email": "ci@matchmate-ci-test.iam.gserviceaccount.com",
            "client_id": "1234567890"
          }
          EOF

      - name: Build and run tests with Gradle
        env:
          JWT_SECRET: "ci-dummy-jwt-secret-key-that-is-at-least-32-bytes-long!!"
          DB_PASSWORD: "ci-dummy-db-password"
        run: ./gradlew check bootJar --no-daemon

      - name: Upload Jar Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/matchmate_backend-*.jar
          retention-days: 1

  image:
    name: Build & Push Container Image
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Jar Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/matchmate-backend
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Prune old package versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'matchmate-backend'
          package-type: 'container'
          min-versions-to-keep: 20

  deploy:
    name: Trigger Deployment
    needs: image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
